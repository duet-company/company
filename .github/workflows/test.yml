name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 6 AM UTC
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
        test-type: [unit, integration]
    
    services:
      # Mock database service for integration tests
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install -e .
    
    - name: Run tests with pytest
      if: matrix.test-type == 'unit'
      run: |
        pytest tests/unit/ -v --cov=apps/backend/src/agents --cov-report=xml:coverage-unit.xml --cov-report=term-missing
    
    - name: Run integration tests
      if: matrix.test-type == 'integration'
      run: |
        pytest tests/integration/ -v --cov=apps/backend/src/api --cov-report=xml:coverage-integration.xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage-*.xml
        fail_ci_if_error: true
        verbose: true
    
    - name: Run security tests
      run: |
        bandit -r apps/backend/src/ -f json -o bandit-report.json
        safety check --json --output safety-report.json
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports-${{ matrix.python-version }}
        path: |
          bandit-report.json
          safety-report.json
    
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Tests (${{ matrix.test-type }})
        path: 'test-results.xml'
        reporter: java-junit

  performance-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install -e .
    
    - name: Run performance tests
      run: |
        pytest tests/performance/ -v --performance
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: |
          performance-report.json
          locust-report.html

  e2e-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    
    - name: Install Playwright browsers
      uses: microsoft/playwright-github-action@v1
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install -e .
        npm ci
    
    - name: Run E2E tests
      run: |
        pytest tests/e2e/ -v --headless
    
    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      with:
        name: e2e-results
        path: |
          test-results-e2e.xml
          screenshots/

  test-report:
    runs-on: ubuntu-latest
    needs: [test, performance-test, e2e-test]
    
    steps:
    - name: Generate comprehensive test report
      run: |
        cat > test-summary.md << EOF
        # Duet Company Test Summary
        
        ## Test Execution Summary
        - **Date:** $(date -u)
        - **Commit:** ${{ github.sha }}
        - **Branch:** ${{ github.ref }}
        
        ## Unit Tests
        - **Status:** ${{ needs.test.result }}
        - **Coverage:** 95%+ target
        
        ## Integration Tests
        - **Status:** ${{ needs.test.result }}
        - **Coverage:** 80%+ target
        
        ## Performance Tests
        - **Status:** ${{ needs.performance-test.result }}
        - **Metrics:** Response time <500ms
        
        ## E2E Tests
        - **Status:** ${{ needs.e2e-test.result }}
        - **Browser:** Chrome, Firefox, Safari
        
        ## Security Tests
        - **Bandit:** Static analysis complete
        - **Safety:** Dependency scanning complete
        
        ## Artifacts
        - Coverage reports: coverage-*.xml
        - Security reports: bandit-report.json, safety-report.json
        - Performance reports: performance-report.json
        - E2E reports: test-results-e2e.xml
        EOF
        
        echo "Test summary generated:"
        cat test-summary.md
    
    - name: Upload test summary
      uses: actions/upload-artifact@v3
      with:
        name: test-summary
        path: test-summary.md