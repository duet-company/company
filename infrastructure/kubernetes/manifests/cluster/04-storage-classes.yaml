# Storage Classes for AI Data Labs Cluster
# These define different storage tiers for different use cases

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-ssd
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: high-iops
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
# Persistent Volumes for standard storage
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-standard-1
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /mnt/data/pv-standard-1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-standard-2
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /mnt/data/pv-standard-2
---
# Persistent Volumes for fast SSD storage
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-fast-ssd-1
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fast-ssd
  hostPath:
    path: /mnt/data/pv-fast-ssd-1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-fast-ssd-2
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fast-ssd
  hostPath:
    path: /mnt/data/pv-fast-ssd-2
---
# Persistent Volumes for high IOPS storage (for databases)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-high-iops-1
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: high-iops
  hostPath:
    path: /mnt/data/pv-high-iops-1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-high-iops-2
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: high-iops
  hostPath:
    path: /mnt/data/pv-high-iops-2
