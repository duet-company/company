---
# Optional: Ingress for external ClickHouse access
# Only enable if you need external clients to connect directly to ClickHouse
# Usually, backend services within the cluster should use the ClusterIP service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clickhouse-ingress
  namespace: clickhouse
  labels:
    app: clickhouse
    component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Uncomment to enable basic auth (recommended)
    # nginx.ingress.kubernetes.io/auth-type: basic
    # nginx.ingress.kubernetes.io/auth-secret: clickhouse-basic-auth
    # nginx.ingress.kubernetes.io/auth-realm: "ClickHouse Authentication"
spec:
  tls:
    - hosts:
        - clickhouse.aidatalabs.ai
      secretName: clickhouse-tls
  rules:
    - host: clickhouse.aidatalabs.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clickhouse
                port:
                  number: 8123  # HTTP port
