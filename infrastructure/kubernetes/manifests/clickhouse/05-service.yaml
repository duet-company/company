---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: clickhouse
  labels:
    app: clickhouse
    component: service
spec:
  selector:
    app: clickhouse
  ports:
    - name: tcp
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
    - name: interserver
      port: 9009
      targetPort: 9009
      protocol: TCP
  clusterIP: None  # Headless service for StatefulSet
  publishNotReadyAddresses: true
