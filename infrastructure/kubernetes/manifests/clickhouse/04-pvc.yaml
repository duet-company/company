---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data-pvc
  namespace: clickhouse
  labels:
    app: clickhouse
    component: data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: clickhouse-fast
  resources:
    requests:
      storage: 100Gi
  # Uncomment for specific volume binding:
  # volumeName: clickhouse-data-pv

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-logs-pvc
  namespace: clickhouse
  labels:
    app: clickhouse
    component: logs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi
