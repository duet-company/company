  namespace: clickhouse
  labels:
    app: clickhouse
    component: secrets
type: Opaque
stringData:
  # IMPORTANT: Change these passwords in production!
  # To generate a SHA256 hash: echo -n "yourpassword" | sha256sum
  CH_PASSWORD_DEFAULT: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"  # empty string hash
  CH_PASSWORD_READONLY: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"  # empty string hash
  CH_PASSWORD_ADMIN: "c7ad44badorrhea2a2adb83a413ac6a995d22f70424a5d4f44c1f8e7f8d8b9a3"  # placeholder hash (change this!)

  # Database credentials
  CH_DB_NAME: "default"
  CH_DB_USER: "default"

  # For external connectivity (if needed)
  # CH_HOST: "clickhouse.clickhouse.svc.cluster.local"
  # CH_PORT: "9000"
