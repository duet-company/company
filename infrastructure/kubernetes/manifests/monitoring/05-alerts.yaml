apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: general
        rules:
          - alert: HighErrorRate
            expr: rate(aidatalabs_api_errors_total[5m]) / rate(aidatalabs_api_requests_total[5m]) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High API error rate detected"
              description: "Error rate is {{ $value }} (threshold: 0.05)"

          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(aidatalabs_api_request_duration_seconds_bucket[5m])) > 1.0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High API latency detected"
              description: "95th percentile latency is {{ $value }}s (threshold: 1.0s)"

          - alert: AgentDown
            expr: aidatalabs_agents_active == 0
            for: 3m
            labels:
              severity: critical
            annotations:
              summary: "No active AI agents"
              description: "All agents appear to be down"

          - alert: HighMemoryUsage
            expr: aidatalabs_system_memory_bytes / node_memory_MemTotal_bytes > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage"
              description: "Memory usage is {{ $value }}%"

          - alert: HighCPUUsage
            expr: rate(aidatalabs_system_cpu_percent[5m]) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage"
              description: "CPU usage is {{ $value }}%"