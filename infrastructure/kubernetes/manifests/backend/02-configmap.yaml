apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: aidatalabs
  labels:
    app: backend
data:
  # Database configuration
  POSTGRES_HOST: "clickhouse-service.aidatalabs.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "aidatalabs"
  CLICKHOUSE_HOST: "clickhouse-service.aidatalabs.svc.cluster.local"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DATABASE: "aidatalabs"

  # Application configuration
  APP_NAME: "AI Data Labs API"
  APP_VERSION: "0.1.0"
  LOG_LEVEL: "INFO"

  # CORS configuration
  CORS_ORIGINS: "*"
  CORS_ALLOW_CREDENTIALS: "true"

  # AI Provider configuration (API keys in secrets)
  ANTHROPIC_API_URL: "https://api.anthropic.com"
  OPENAI_API_URL: "https://api.openai.com/v1"
  ZHIPU_API_URL: "https://open.bigmodel.cn/api/paas/v4"

  # Agent configuration
  MAX_AGENTS: "10"
  AGENT_TIMEOUT: "300"
  TASK_QUEUE_SIZE: "100"

  # Monitoring configuration
  ENABLE_METRICS: "true"
  METRICS_PATH: "/metrics"
