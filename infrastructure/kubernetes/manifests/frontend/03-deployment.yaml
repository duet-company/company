apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: aidatalabs
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nextjs
        image: aidatalabs/frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP

        env:
        # Backend API configuration
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: NEXT_PUBLIC_API_URL
        - name: NEXT_PUBLIC_API_WS_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: NEXT_PUBLIC_API_WS_URL

        # Application configuration
        - name: NEXT_PUBLIC_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: NEXT_PUBLIC_APP_NAME
        - name: NEXT_PUBLIC_APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: NEXT_PUBLIC_APP_VERSION

        # Feature flags
        - name: NEXT_PUBLIC_ENABLE_CHAT
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: NEXT_PUBLIC_ENABLE_CHAT
        - name: NEXT_PUBLIC_ENABLE_DASHBOARD
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: NEXT_PUBLIC_ENABLE_DASHBOARD
        - name: NEXT_PUBLIC_ENABLE_QUERY
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: NEXT_PUBLIC_ENABLE_QUERY

        # Analytics
        - name: NEXT_PUBLIC_ENABLE_ANALYTICS
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: NEXT_PUBLIC_ENABLE_ANALYTICS

        # Environment
        - name: NEXT_PUBLIC_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: NEXT_PUBLIC_ENVIRONMENT

        # Node environment
        - name: NODE_ENV
          value: "production"

        # Resource limits
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

        # Health checks (Next.js health endpoint)
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

      # Restart policy
      restartPolicy: Always
